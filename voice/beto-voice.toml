# Configuração do serviço local de voz do Beto. Tudo que é parâmetro mora aqui; segredos vão no .env.
# Env sobrescreve: BRAIN_URL, VOICE_SERVICE_TOKEN, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID.

[brain]
# Onde o cérebro do Beto está (Vercel, ou http://localhost:3000 com `npm run dev`).
url = "http://localhost:3000"
# Quantas mensagens da conversa vão em cada chamada (igual ao navegador hoje).
history = 20
timeout_secs = 60

[stt]
# "mlx" usa a GPU do Mac (Metal); "faster" usa o faster-whisper em CPU.
engine = "mlx"
model = "mlx-community/whisper-large-v3-turbo"
faster_model = "large-v3-turbo"
language = "pt"
# Vocabulário do Rodrigo: entra no initial_prompt do Whisper para ele acertar nomes próprios e termos técnicos.
vocabulary = [
  "MyHub", "Beto", "Muno", "Spring Boot", "pomodoro", "Ubatuba", "AWS", "Rocketseat",
  "Next.js", "Vercel", "Groq", "ElevenLabs", "Supabase", "Neon", "Drizzle", "pgvector",
  "Pipecat", "Whisper", "Java", "Postgres", "Docker", "Linear", "GitHub", "Prefeitura de Ubatuba",
]
# Texto livre somado ao vocabulário (exemplo de estilo de pontuação ajuda o Whisper).
initial_prompt = "Conversa em português do Brasil com o Beto, assistente pessoal do Rodrigo."
# Segmentos com probabilidade de "não é fala" acima disso são descartados.
no_speech_prob = 0.6
# Transcrição parcial: a cada tantos segundos de fala, reprocessa o buffer e mostra na tela. 0 desliga.
interim_every_secs = 1.5

[turn]
# VAD (Silero): silêncio curto só sinaliza; quem decide o fim do turno é o smart-turn.
vad_stop_secs = 0.2
vad_start_secs = 0.2
vad_confidence = 0.7
# smart-turn v3: se a frase parece incompleta ("é, então..."), espera até este silêncio antes de fechar o turno (2s: ele pausa pensando no meio da frase).
smart_turn_stop_secs = 2.0
smart_turn_max_duration_secs = 8
# Depois de o Beto responder, quanto tempo ele continua ouvindo sem precisar do nome dele.
follow_up_secs = 9
# Toque no mascote (ou wake word sozinho): quanto tempo fica ouvindo.
listen_secs = 12
# Falar por cima do Beto o interrompe.
barge_in = true
wake_words = ["beto", "ei beto", "oi beto", "olá beto", "ola beto", "hey beto", "acorda beto", "e aí beto"]
end_phrases = ["valeu", "obrigado", "obrigada", "tchau", "é isso", "só isso", "era isso", "por hoje é isso", "pode parar", "fechou", "beleza"]

[tts]
model = "eleven_turbo_v2_5"
stability = 0.5
similarity_boost = 0.8
style = 0.2
speed = 1.0

[server]
host = "127.0.0.1"
port = 7860
cors_origins = ["http://localhost:3000", "https://beto-ia.vercel.app"]
