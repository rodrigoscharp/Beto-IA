# Configuração do serviço local de voz do Beto. Tudo que é parâmetro mora aqui; segredos vão no .env.
# Env sobrescreve: BRAIN_URL, VOICE_SERVICE_TOKEN, VOICESTUDIO_URL.

[brain]
# Onde o cérebro do Beto está (Vercel, ou http://localhost:3000 com `npm run dev`).
url = "http://localhost:3000"
# Quantas mensagens da conversa vão em cada chamada (igual ao navegador hoje).
history = 20
timeout_secs = 60

[stt]
# "mlx" usa a GPU do Mac (Metal); "faster" usa o faster-whisper em CPU.
engine = "mlx"
model = "mlx-community/whisper-large-v3-turbo"
faster_model = "large-v3-turbo"
language = "pt"
# Vocabulário do Rodrigo: entra no initial_prompt do Whisper para ele acertar nomes próprios e termos técnicos.
vocabulary = [
  "MyHub", "Beto", "Muno", "Spring Boot", "pomodoro", "Ubatuba", "AWS", "Rocketseat",
  "Next.js", "Vercel", "Groq", "ElevenLabs", "Supabase", "Neon", "Drizzle", "pgvector",
  "Pipecat", "Whisper", "Java", "Postgres", "Docker", "Linear", "GitHub", "Prefeitura de Ubatuba",
]
# Texto livre somado ao vocabulário (exemplo de estilo de pontuação ajuda o Whisper).
initial_prompt = "Conversa em português do Brasil com o Beto, assistente pessoal do Rodrigo."
# Segmentos com probabilidade de "não é fala" acima disso são descartados.
no_speech_prob = 0.6
# Transcrição parcial: a cada tantos segundos de fala, reprocessa o buffer e mostra na tela. 0 desliga.
interim_every_secs = 1.5

[turn]
# VAD (Silero): silêncio curto só sinaliza; quem decide o fim do turno é o smart-turn.
vad_stop_secs = 0.2
vad_start_secs = 0.2
vad_confidence = 0.7
# smart-turn v3: se a frase parece incompleta ("é, então..."), espera até este silêncio antes de fechar o turno (2s: ele pausa pensando no meio da frase).
smart_turn_stop_secs = 2.0
smart_turn_max_duration_secs = 8
# Depois de o Beto responder, quanto tempo ele continua ouvindo sem precisar do nome dele.
follow_up_secs = 9
# Toque no mascote (ou wake word sozinho): quanto tempo fica ouvindo.
listen_secs = 12
# Falar por cima do Beto o interrompe.
barge_in = true
wake_words = ["beto", "ei beto", "oi beto", "olá beto", "ola beto", "hey beto", "acorda beto", "e aí beto"]
end_phrases = ["valeu", "obrigado", "obrigada", "tchau", "é isso", "só isso", "era isso", "por hoje é isso", "pode parar"]
# Modo contínuo: depois de chamar o Beto, a conversa segue aberta sem precisar repetir o nome; só fecha por end_phrases ou ociosidade.
continuous = true
# Segundos de silêncio total até a conversa contínua fechar sozinha.
idle_close_secs = 60
# Pedidos de pausa ("hmm", "peraí"): o Beto espera em vez de responder.
hold_phrases = ["hmm", "hum", "peraí", "pera", "espera", "deixa eu pensar", "deixa eu ver", "calma"]

[ack]
# Frases curtas (até 6 palavras) que o Beto fala enquanto busca algo; uma é sorteada conforme o tipo de pedido.
# Pedido sobre roteiro ou plano de conteúdo.
conteudo = ["Deixa eu abrir o roteiro.", "Vou pegar o plano."]
# Pedido sobre agenda e compromissos.
agenda = ["Deixa eu ver a agenda.", "Só um segundo, olhando a agenda.", "Vou checar a agenda."]
# Pedido sobre tarefas, hábitos e projetos do My Hub.
myhub = ["Deixa eu ver no My Hub.", "Um instante, abrindo o My Hub."]
# Pedido sobre o que o Beto guardou na memória.
memoria = ["Deixa eu ver o que guardei.", "Um segundo."]
# Qualquer outra ferramenta.
geral = ["Um segundo.", "Deixa eu ver.", "Já vejo isso."]

[tts]
# Voz pelo VoiceStudio no Mac (scripts/voicestudio/ o deixa sempre ligado). Env VOICESTUDIO_URL sobrescreve a url.
url = "http://127.0.0.1:3900"
# Perfil de voz criado por scripts/voicestudio/setup-profile.sh: a mesma voz do app.
voice = "Beto"
# Passos de geração: 8 = modo rápido (2 a 3 s por frase); 16 soa um pouco melhor e leva o dobro.
num_step = 8
speed = 1.0

[server]
host = "127.0.0.1"
port = 7860
cors_origins = ["http://localhost:3000", "https://betoia.vercel.app"]
